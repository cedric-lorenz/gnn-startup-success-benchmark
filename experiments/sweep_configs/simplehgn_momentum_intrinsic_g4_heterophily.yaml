# =============================================================================
# Bayesian sweep: SimpleHGN on Momentum
# =============================================================================
# Target: Joint (mom + liq)/2 AUC-PR — unified ICDM selection metric
# Selection metric: val_auc_pr_joint (maximize)
# Search: 18 hyperparameters | Fixed: 2 model/target choices
# 
# Requires 80 GB GPU. hidden=128 × heads=8 × num_layers=3 on the
# Crunchbase graph pushes O(E × H × D) message tensors past 60 GB;
# A40 (44 GB) OOMs even at hidden=64 × heads=8. Route via
# sbatch_sweep_generic.sh with GPU_MEM:80GB constraint.
# 
# Simple-HGN's signature L2-normalized embeddings are held fixed;
# ablation of l2_normalize is a separate experiment.
# Generated by scripts/generate_sweep_configs.py — do not edit by hand,
# change SEARCH_SPACES["SimpleHGN"] in that file and regenerate.
# =============================================================================

project: gnn-startup-successs
method: bayes
metric:
  name: val_auc_pr_joint
  goal: maximize
program: src/main.py
command:
- ${env}
- python
- ${program}
- ${args}
early_terminate:
  type: hyperband
  min_iter: 10
  eta: 3
parameters:
  train.lr:
    distribution: log_uniform_values
    min: 0.0005
    max: 0.02
  train.weight_decay:
    distribution: log_uniform_values
    min: 1.0e-06
    max: 0.01
  train.gradient_clip_val:
    distribution: uniform
    min: 0.5
    max: 2.0
  train.loss.label_smoothing:
    distribution: uniform
    min: 0.0
    max: 0.1
  train.loss.momentum_weight:
    distribution: uniform
    min: 0.3
    max: 2.0
  train.loss.liquidity_weight:
    distribution: uniform
    min: 0.1
    max: 2.0
  train.optimizer:
    values:
    - Adam
    - AdamW
  train.scheduler.type:
    values:
    - CosineAnnealingLR
    - ReduceLROnPlateau
    - None
  train.scheduler.warmup_epochs:
    values:
    - 0
    - 5
    - 10
    - 20
  models.SimpleHGN.dropout:
    distribution: uniform
    min: 0.0
    max: 0.6
  models.SimpleHGN.attn_dropout:
    distribution: uniform
    min: 0.0
    max: 0.5
  models.SimpleHGN.hidden_channels:
    values:
    - 32
    - 64
  models.SimpleHGN.heads:
    values:
    - 2
    - 4
  models.SimpleHGN.num_layers:
    values:
    - 2
    - 3
  models.SimpleHGN.alpha:
    distribution: uniform
    min: 0.0
    max: 0.2
  models.SimpleHGN.negative_slope:
    values:
    - 0.05
    - 0.1
    - 0.2
  models.SimpleHGN.residual:
    values:
    - true
    - false
  models.SimpleHGN.activation_type:
    values:
    - elu
    - relu
    - leaky_relu
  models.SimpleHGN.l2_normalize:
    value: true
  models.SimpleHGN.bias:
    value: false
  train.model:
    value: SimpleHGN
  data_processing.ablation.feature_information_level:
    value: intrinsic
  data_processing.graph_variant:
    value: g4_heterophily
  data_processing.edge_loading.founder_coworking:
    value: true
  seed:
    value: 42
  train.epochs:
    value: 100
  analysis.enable_downstream_analysis:
    value: false
  analysis.enable_homophily_analysis:
    value: false
  analysis.enable_visualization_analysis:
    value: false
  explain.enabled:
    value: false
  wandb.enabled:
    value: true
