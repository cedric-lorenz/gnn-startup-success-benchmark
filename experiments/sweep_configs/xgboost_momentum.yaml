# =============================================================================
# Bayesian sweep: XGBoost on Momentum
# =============================================================================
# Target: Joint (mom + liq)/2 AUC-PR — unified ICDM selection metric
# Selection metric: val_auc_pr_joint (maximize)
# Search: 18 hyperparameters | Fixed: 3 model/target choices
# 
# XGBoost trains in one call; train.epochs is a placeholder.
# hyperband early_terminate is effectively a no-op. CPU-only is fine;
# full sweep completes in ~1-2 hours. The intrinsic variant (--variant
# intrinsic) uses the same 29 features as MLP-intrinsic for apples-to-
# apples comparison.
# Generated by scripts/generate_sweep_configs.py — do not edit by hand,
# change SEARCH_SPACES["XGBoost"] in that file and regenerate.
# =============================================================================

project: gnn-startup-successs
method: bayes
metric:
  name: val_auc_pr_joint
  goal: maximize
program: src/main.py
command:
- ${env}
- python
- ${program}
- ${args}
early_terminate:
  type: hyperband
  min_iter: 10
  eta: 3
parameters:
  models.XGBoost.n_estimators:
    values:
    - 100
    - 200
    - 400
    - 800
  models.XGBoost.max_depth:
    values:
    - 3
    - 5
    - 7
    - 9
  models.XGBoost.learning_rate:
    distribution: log_uniform_values
    min: 0.001
    max: 0.3
  models.XGBoost.subsample:
    distribution: uniform
    min: 0.5
    max: 1.0
  models.XGBoost.colsample_bytree:
    distribution: uniform
    min: 0.5
    max: 1.0
  models.XGBoost.min_child_weight:
    values:
    - 1
    - 5
    - 10
  models.XGBoost.gamma:
    distribution: uniform
    min: 0.0
    max: 5.0
  models.XGBoost.reg_alpha:
    distribution: log_uniform_values
    min: 0.001
    max: 10.0
  models.XGBoost.reg_lambda:
    distribution: log_uniform_values
    min: 0.001
    max: 10.0
  models.XGBoost.scale_pos_weight:
    value: 7.0
  models.XGBoost.objective:
    value: binary:logistic
  models.XGBoost.tree_method:
    value: hist
  train.model:
    value: XGBoost
  seed:
    value: 42
  train.epochs:
    value: 1
  analysis.enable_downstream_analysis:
    value: false
  analysis.enable_homophily_analysis:
    value: false
  analysis.enable_visualization_analysis:
    value: false
  explain.enabled:
    value: false
  wandb.enabled:
    value: true
