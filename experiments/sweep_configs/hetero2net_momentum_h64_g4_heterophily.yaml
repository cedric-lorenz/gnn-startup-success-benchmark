# =============================================================================
# Bayesian sweep: Hetero2Net on Momentum
# =============================================================================
# Target: Joint (mom + liq)/2 AUC-PR — unified ICDM selection metric
# Selection metric: val_auc_pr_joint (maximize)
# Search: 16 hyperparameters | Fixed: 8 model/target choices
# 
# aux_reduction fixed to 'sum' (paper-faithful, matches reference
# implementation's `loss += alpha * dist_corr(...)` accumulation).
# Paper α, β ∈ {0, 0.1, ..., 0.5} from Appendix B.3 apply directly.
# On our 32-metapath × 2-layer graph, the 64 summed corr terms mean
# α=0.2 is ~16× stronger than paper's DBLP baseline (4 sum terms);
# the grid is 0-inclusive and dense on the low end for this reason.
# 
# Resource envelope: hidden=64 fits on A40 (46 GB); hidden=128 needs
# 80 GB (A100 / H100) because of the 32 startup-startup metapaths.
# 
# MTL rule: this is the single Hetero2Net sweep (no separate
# liquidity sweep). Extract liquidity winners with
# scripts/replicate_best.py --metric val_auc_pr_liq.
# Generated by scripts/generate_sweep_configs.py — do not edit by hand,
# change SEARCH_SPACES["Hetero2Net"] in that file and regenerate.
# =============================================================================

project: gnn-startup-successs
method: bayes
metric:
  name: val_auc_pr_joint
  goal: maximize
program: src/main.py
command:
- ${env}
- python
- ${program}
- ${args}
early_terminate:
  type: hyperband
  min_iter: 10
  eta: 3
parameters:
  train.lr:
    values:
    - 0.001
    - 0.005
    - 0.01
  train.weight_decay:
    values:
    - 0.0
    - 0.0001
    - 0.0005
  train.gradient_clip_val:
    distribution: uniform
    min: 0.5
    max: 2.0
  train.loss.label_smoothing:
    distribution: uniform
    min: 0.0
    max: 0.1
  train.loss.momentum_weight:
    distribution: uniform
    min: 0.3
    max: 2.0
  train.loss.liquidity_weight:
    distribution: uniform
    min: 0.1
    max: 2.0
  train.optimizer:
    values:
    - Adam
    - AdamW
  train.scheduler.type:
    values:
    - CosineAnnealingLR
    - ReduceLROnPlateau
    - None
  train.scheduler.warmup_epochs:
    values:
    - 0
    - 5
    - 10
    - 20
  models.Hetero2Net.alpha:
    values:
    - 0.0
    - 0.1
    - 0.2
    - 0.4
  models.Hetero2Net.beta:
    values:
    - 0.0
    - 0.2
    - 0.4
    - 0.5
  models.Hetero2Net.label_mask_ratio:
    values:
    - 0.5
    - 0.7
    - 0.9
  models.Hetero2Net.use_label_propagation:
    values:
    - true
    - false
  models.Hetero2Net.hidden_channels:
    value: 64
  models.Hetero2Net.dropout:
    values:
    - 0.0
    - 0.2
    - 0.5
  models.Hetero2Net.mask_ratio:
    values:
    - 0.3
    - 0.5
    - 0.7
  models.Hetero2Net.num_layers:
    value: 2
  models.Hetero2Net.activation_type:
    value: relu
  models.Hetero2Net.num_label_classes:
    value: 2
  models.Hetero2Net.root_weight:
    value: true
  models.Hetero2Net.normalize_bn:
    value: true
  models.Hetero2Net.corr_on_metapaths_only:
    value: true
  models.Hetero2Net.aux_reduction:
    value: sum
  models.Hetero2Net.aux_loss_weight:
    value: 1.0
  train.model:
    value: Hetero2Net
  data_processing.graph_variant:
    value: g4_heterophily
  data_processing.edge_loading.founder_coworking:
    value: true
  seed:
    value: 42
  train.epochs:
    value: 40
  data_processing.ablation.feature_information_level:
    value: intrinsic
  analysis.enable_downstream_analysis:
    value: false
  analysis.enable_homophily_analysis:
    value: false
  analysis.enable_visualization_analysis:
    value: false
  explain.enabled:
    value: false
  wandb.enabled:
    value: true
