# =============================================================================
# Bayesian sweep: SageGNN on Momentum
# =============================================================================
# Target: Joint (mom + liq)/2 AUC-PR — unified ICDM selection metric
# Selection metric: val_auc_pr_joint (maximize)
# Search: 13 hyperparameters | Fixed: 2 model/target choices
# 
# A40 memory envelope (44 GB, 61 edge types): hidden=128, depth=2
# is the ceiling. hidden=256 or depth=3 OOMs in 5/5 trials (measured
# on sweep lgnm0lg9 at 2026-04-22). If the 80 GB pool frees up, a
# widened SageGNN sweep at hidden ∈ {64, 128, 256} is worth running.
# Generated by scripts/generate_sweep_configs.py — do not edit by hand,
# change SEARCH_SPACES["SageGNN"] in that file and regenerate.
# =============================================================================

project: gnn-startup-successs
method: bayes
metric:
  name: val_auc_pr_joint
  goal: maximize
program: src/main.py
command:
- ${env}
- python
- ${program}
- ${args}
early_terminate:
  type: hyperband
  min_iter: 10
  eta: 3
parameters:
  train.lr:
    distribution: log_uniform_values
    min: 0.0005
    max: 0.02
  train.weight_decay:
    distribution: log_uniform_values
    min: 1.0e-06
    max: 0.01
  train.gradient_clip_val:
    distribution: uniform
    min: 0.5
    max: 2.0
  train.loss.label_smoothing:
    distribution: uniform
    min: 0.0
    max: 0.1
  train.loss.momentum_weight:
    distribution: uniform
    min: 0.3
    max: 2.0
  train.loss.liquidity_weight:
    distribution: uniform
    min: 0.1
    max: 2.0
  train.optimizer:
    values:
    - Adam
    - AdamW
  train.scheduler.type:
    values:
    - CosineAnnealingLR
    - ReduceLROnPlateau
    - None
  train.scheduler.warmup_epochs:
    values:
    - 0
    - 5
    - 10
    - 20
  models.SageGNN.dropout:
    distribution: uniform
    min: 0.0
    max: 0.5
  models.SageGNN.hidden_channels:
    values:
    - 64
    - 128
  models.SageGNN.activation_type:
    values:
    - prelu
    - relu
  models.SageGNN.aggr:
    values:
    - mean
    - max
  models.SageGNN.normalize:
    value: true
  models.SageGNN.num_layers:
    value: 2
  train.model:
    value: SageGNN
  data_processing.graph_variant:
    value: g4_heterophily
  data_processing.edge_loading.founder_coworking:
    value: true
  seed:
    value: 42
  train.epochs:
    value: 100
  data_processing.ablation.feature_information_level:
    value: intrinsic
  analysis.enable_downstream_analysis:
    value: false
  analysis.enable_homophily_analysis:
    value: false
  analysis.enable_visualization_analysis:
    value: false
  explain.enabled:
    value: false
  wandb.enabled:
    value: true
