# =============================================================================
# Bayesian sweep: VenGNN on Momentum
# =============================================================================
# Target: Joint (mom + liq)/2 AUC-PR — unified ICDM selection metric
# Selection metric: val_auc_pr_joint (maximize)
# Search: 15 hyperparameters | Fixed: 6 model/target choices
# Generated by scripts/generate_sweep_configs.py — do not edit by hand,
# change SEARCH_SPACES["VenGNN"] in that file and regenerate.
# =============================================================================

project: gnn-startup-successs
method: bayes
metric:
  name: val_auc_pr_joint
  goal: maximize
program: src/main.py
command:
- ${env}
- python
- ${program}
- ${args}
early_terminate:
  type: hyperband
  min_iter: 10
  eta: 3
parameters:
  train.lr:
    distribution: log_uniform_values
    min: 0.0005
    max: 0.02
  train.weight_decay:
    distribution: log_uniform_values
    min: 1.0e-06
    max: 0.01
  train.gradient_clip_val:
    distribution: uniform
    min: 0.5
    max: 2.0
  train.loss.label_smoothing:
    distribution: uniform
    min: 0.0
    max: 0.1
  train.loss.momentum_weight:
    distribution: uniform
    min: 0.3
    max: 2.0
  train.loss.liquidity_weight:
    distribution: uniform
    min: 0.1
    max: 2.0
  train.optimizer:
    values:
    - Adam
    - AdamW
  train.scheduler.type:
    values:
    - CosineAnnealingLR
    - ReduceLROnPlateau
    - None
  train.scheduler.warmup_epochs:
    values:
    - 0
    - 5
    - 10
    - 20
  models.VenGNN.dropout:
    distribution: uniform
    min: 0.0
    max: 0.5
  models.VenGNN.hidden_channels:
    values:
    - 64
    - 128
  models.VenGNN.heads:
    values:
    - 2
    - 4
  models.VenGNN.num_layers:
    values:
    - 2
    - 3
  models.VenGNN.rw_num_walks:
    values:
    - 4
    - 8
    - 16
  models.VenGNN.rw_walk_length:
    values:
    - 3
    - 5
    - 7
  models.VenGNN.use_paper_attention:
    value: true
  models.VenGNN.paper_widening:
    value: false
  models.VenGNN.activation_type:
    value: elu
  models.VenGNN.gat_edge_mode:
    value: multiplicative
  models.VenGNN.branch_mode:
    value: a_only
  models.VenGNN.rw_weighted:
    value: false
  train.model:
    value: VenGNN
  data_processing.graph_variant:
    value: g4_heterophily
  data_processing.edge_loading.founder_coworking:
    value: true
  seed:
    value: 42
  train.epochs:
    value: 100
  data_processing.ablation.feature_information_level:
    value: intrinsic
  analysis.enable_downstream_analysis:
    value: false
  analysis.enable_homophily_analysis:
    value: false
  analysis.enable_visualization_analysis:
    value: false
  explain.enabled:
    value: false
  wandb.enabled:
    value: true
