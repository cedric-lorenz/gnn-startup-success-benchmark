# =============================================================================
# Bayesian sweep: RGCN on Momentum
# =============================================================================
# Target: Joint (mom + liq)/2 AUC-PR — unified ICDM selection metric
# Selection metric: val_auc_pr_joint (maximize)
# Search: 13 hyperparameters | Fixed: 2 model/target choices
# 
# Requires 80 GB GPU. The 61-relation graph puts RGCN under heavy
# memory pressure: hidden=128 × num_layers=2 peaks ~58 GB, which
# OOMs on A40 (44 GB). Route via sbatch_sweep_generic.sh
# (constraint GPU_MEM:80GB), not the 40 GB or A40 pools.
# 
# num_layers is fixed at 2 (depth=3 OOMs, depth=1 is degenerate).
# Generated by scripts/generate_sweep_configs.py — do not edit by hand,
# change SEARCH_SPACES["RGCN"] in that file and regenerate.
# =============================================================================

project: gnn-startup-successs
method: bayes
metric:
  name: val_auc_pr_joint
  goal: maximize
program: src/main.py
command:
- ${env}
- python
- ${program}
- ${args}
early_terminate:
  type: hyperband
  min_iter: 10
  eta: 3
parameters:
  train.lr:
    distribution: log_uniform_values
    min: 0.0005
    max: 0.02
  train.weight_decay:
    distribution: log_uniform_values
    min: 1.0e-06
    max: 0.01
  train.gradient_clip_val:
    distribution: uniform
    min: 0.5
    max: 2.0
  train.loss.label_smoothing:
    distribution: uniform
    min: 0.0
    max: 0.1
  train.loss.momentum_weight:
    distribution: uniform
    min: 0.3
    max: 2.0
  train.loss.liquidity_weight:
    distribution: uniform
    min: 0.1
    max: 2.0
  train.optimizer:
    values:
    - Adam
    - AdamW
  train.scheduler.type:
    values:
    - CosineAnnealingLR
    - ReduceLROnPlateau
    - None
  train.scheduler.warmup_epochs:
    values:
    - 0
    - 5
    - 10
    - 20
  models.RGCN.dropout:
    distribution: uniform
    min: 0.0
    max: 0.5
  models.RGCN.hidden_channels:
    values:
    - 64
    - 128
  models.RGCN.num_bases:
    values:
    - 15
    - 30
  models.RGCN.activation_type:
    values:
    - relu
    - elu
  models.RGCN.normalize:
    value: true
  models.RGCN.num_layers:
    value: 2
  train.model:
    value: RGCN
  data_processing.graph_variant:
    value: g4_heterophily
  data_processing.edge_loading.founder_coworking:
    value: true
  seed:
    value: 42
  train.epochs:
    value: 100
  data_processing.ablation.feature_information_level:
    value: intrinsic
  analysis.enable_downstream_analysis:
    value: false
  analysis.enable_homophily_analysis:
    value: false
  analysis.enable_visualization_analysis:
    value: false
  explain.enabled:
    value: false
  wandb.enabled:
    value: true
