analysis:
  enable_downstream_analysis: false
  enable_homophily_analysis: false
  enable_visualization_analysis: false
data_processing:
  ablation:
    feature_information_level: intrinsic
  edge_loading:
    founder_coworking: true
  graph_variant: g4_heterophily
explain:
  enabled: false
models:
  RGCN:
    activation_type: elu
    dropout: 0.4605878094172357
    hidden_channels: 64
    normalize: true
    num_bases: 15
    num_layers: 2
seed: 42
train:
  epochs: 100
  gradient_clip_val: 1.0197395584019926
  loss:
    label_smoothing: 0.025534352495565793
    liquidity_weight: 0.27690218760820345
    momentum_weight: 1.9331112608166297
  lr: 0.002126192334225984
  model: RGCN
  optimizer: Adam
  scheduler:
    type: None
    warmup_epochs: 10
  weight_decay: 0.0001221888995347486
wandb:
  enabled: true
