analysis:
  enable_downstream_analysis: false
  enable_homophily_analysis: false
  enable_visualization_analysis: false
data_processing:
  ablation:
    feature_information_level: intrinsic
  edge_loading:
    founder_coworking: true
  graph_variant: g4_heterophily
explain:
  enabled: false
models:
  SageGNN:
    activation_type: prelu
    aggr: mean
    dropout: 0.07802218358774565
    hidden_channels: 128
    normalize: true
    num_layers: 2
seed: 42
train:
  epochs: 100
  gradient_clip_val: 1.8688780278292785
  loss:
    label_smoothing: 0.06998231442365892
    liquidity_weight: 0.3392684126563915
    momentum_weight: 1.590915421356066
  lr: 0.012202410415205617
  model: SageGNN
  optimizer: AdamW
  scheduler:
    type: None
    warmup_epochs: 10
  weight_decay: 6.296269717658396e-06
wandb:
  enabled: true
