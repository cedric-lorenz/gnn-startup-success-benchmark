  gradient_clip_val: 0.8032229061821803
  loss:
    label_smoothing: 0.05416352324768198
    momentum_weight: 1.2802522103719025
    liquidity_weight: 1.2159074839144752
  optimizer: AdamW
  scheduler:
    type: None
    warmup_epochs: 5
  model: VenGNN
  epochs: 100
